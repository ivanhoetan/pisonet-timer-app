services:
  - type: web
    name: pisonet-timer-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build -w @pisonet/shared && npm run build -w @pisonet/server
    startCommand: npm run start -w @pisonet/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_EMAIL
        value: admin@pisonet.local
      - key: ADMIN_PASSWORD
        sync: false
